server:
  port: 8080

spring:
  application:
    name: incident-processor

  # - POSTGRESQL ---
  datasource:
    url: jdbc:postgresql://localhost:5433/incident_db
    username: incident_user
    password: incident_pass
    driver-class-name: org.postgresql.Driver

  jpa:
    hibernate:
      ddl-auto: validate          # Flyway manages the schema — JPA just validates
    show-sql: false
    properties:
      hibernate:
        dialect: org.hibernate.dialect.PostgreSQLDialect
        format_sql: true

  # --- Flyway
  flyway:
    enabled: true
    locations: classpath:db/migration

  # ---- Kafka-----
  kafka:
    bootstrap-servers: localhost:9092
    consumer:
      group-id: incident-processor-group
      auto-offset-reset: earliest       # read from beginning if no offset exists
      key-deserializer: org.apache.kafka.common.serialization.StringDeserializer
      value-deserializer: org.springframework.kafka.support.serializer.JsonDeserializer
      properties:
        spring.json.trusted.packages: "com.incidentbot.processor.model"
    producer:
      key-serializer: org.apache.kafka.common.serialization.StringSerializer
      value-serializer: org.springframework.kafka.support.serializer.JsonSerializer

  # - Spring API (OPEN AI) ---
  ai:
    openai:
      api-key: ${OPENAI_API_KEY}        # set this as an environment variable
      chat:
        options:
          model: gpt-4o-mini
          temperature: 0.2              # low temp = more focused, less creative

# ----Kafka topic names (referenced in code via @Value) -----
app:
  kafka:
    topics:
      errors: logs.errors
      warnings: logs.warnings

  # ----- Slack ------
  slack:
    webhook-url: ${SLACK_WEBHOOK_URL:}  # optional — leave blank to skip Slack alerts